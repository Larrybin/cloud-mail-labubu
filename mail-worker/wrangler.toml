name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-03-10"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "cloud-mail"		#d1数据库名字
database_id = "1bcdd0b1-a4c3-468c-a569-4e57b5ef2330"		#d1数据库id

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "1063d837cdd64035a837b9ec75d5dae7"					#kv数据库id

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail"

[triggers]
crons = ["0 16 * * *"]	#定时任务每天晚上12点执行


[vars]
orm_log = false
domain = ["example.com"]
admin = "admin@example.com"
FORM_FILE_TTL_SECONDS = "604800"
INIT_HTTP_ENABLED = "false"
PUBLIC_TOKEN_TTL_SECONDS = "86400"
CORS_ADMIN_ALLOWED_ORIGINS = ""
CORS_PUBLIC_ALLOWED_ORIGINS = ""

# secrets:
# - ADMIN_API_TOKEN
# - FORM_API_TOKEN
# - FORM_FILE_SECRET
# - FORM_TENANT_KEYRING
# - jwt_secret
